<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HFD Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232E7D32'/><path d='M12 70 L36 42 L48 56 L64 34 L90 70Z' fill='%23A5D6A7'/></svg>">
<style>
:root{--leaf:#2E7D32;--forest:#1B5E20;--mint:#E8F5E9;--sprout:#A5D6A7;--harvest:#F9A825;--ink:#1C2B1E;--muted:#5F6F61;--line:#DDE7DE;--bg:#F6F9F6;--card:#fff;--danger:#C62828;--warn:#EF6C00}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--forest),var(--leaf))}
.login-card{background:#fff;border-radius:18px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:12px 0 4px;color:var(--forest);font-size:22px}
.login-card p{color:var(--muted);margin:0 0 22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.gbtn:hover{background:var(--mint)}
.gbtn b{color:#4285F4;font-size:19px}
.err{color:var(--danger);margin-top:12px;font-size:14px}
.credit{margin-top:22px;font-size:12px;color:var(--muted)}
/* shell */
#shell{display:flex;min-height:100vh}
nav{width:220px;background:var(--forest);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:700}
.brand small{display:block;font-weight:400;color:var(--sprout);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#e8f5e9;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:rgba(255,255,255,.14);border-left-color:var(--harvest);color:#fff;font-weight:600}
nav .badge{margin-left:auto;background:var(--harvest);color:var(--ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
nav .foot{margin-top:auto;padding:14px 16px;font-size:12px;color:var(--sprout)}
nav .foot button{margin-top:8px;background:none;border:1px solid var(--sprout);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;width:100%}
main{flex:1;min-width:0;padding:22px 26px 60px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h2{margin:0;font-size:22px;flex:1}
.menu-btn{display:none;background:var(--forest);color:#fff;border:0;border-radius:8px;padding:8px 12px}
/* bits */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.stat .n{font-size:26px;font-weight:700;color:var(--forest)}
.stat .l{color:var(--muted);font-size:13px}
.stat.alert .n{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.panel h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center;gap:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0}
.toolbar input[type=search]{flex:1;min-width:180px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:#FAFCFA;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
tr:hover td{background:#FAFDFA}
.tablewrap{overflow-x:auto;max-height:70vh}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:#E8F5E9;color:var(--forest)}.p-wait{background:#FFF3E0;color:var(--warn)}.p-bad{background:#FFEBEE;color:var(--danger)}.p-gray{background:#ECEFF1;color:#455A64}
.btn{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--mint)}
.btn.pri{background:var(--leaf);color:#fff;border-color:var(--leaf)}.btn.pri:hover{background:var(--forest)}
.btn.bad{color:var(--danger);border-color:#f3c7c7}.btn.bad:hover{background:#FFEBEE}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}
.form .full{grid-column:1/-1}
.form .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.mbox header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mbox header h3{margin:0;flex:1;font-size:17px}
.mbody{padding:16px 18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
@media (max-width:820px){
  nav{position:fixed;left:-240px;z-index:40;transition:left .2s;width:230px}
  nav.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:block}
  main{padding:16px 12px 60px}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <svg width="72" height="72" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2E7D32"/><path d="M12 70 L36 42 L48 56 L64 34 L90 70Z" fill="#A5D6A7"/><path d="M48 82v-16c0-8 6-13 15-15-2 9-7 14-15 14" fill="#fff"/></svg>
    <h1>Himachal Farm Direct</h1>
    <p>Admin dashboard</p>
    <button class="gbtn" id="gbtn"><b>G</b> Sign in with Google</button>
    <div class="err" id="loginErr"></div>
    <div class="credit">App by DK · dharmenderk950@gmail.com · WhatsApp: dkc@1978</div>
  </div>
</section>

<div id="shell" class="hidden">
  <nav id="nav">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#A5D6A7"/><path d="M12 70 L36 42 L48 56 L64 34 L90 70Z" fill="#2E7D32"/></svg>
      <div>HFD Admin<small>Himachal Farm Direct</small></div>
    </div>
    <a data-tab="overview">📊 Overview</a>
    <a data-tab="farmers">👨‍🌾 Farmers <span class="badge hidden" id="bFarmers"></span></a>
    <a data-tab="products">🥬 Products</a>
    <a data-tab="orders">📦 Orders <span class="badge hidden" id="bOrders"></span></a>
    <a data-tab="tickets">🎫 Support tickets <span class="badge hidden" id="bTickets"></span></a>
    <a data-tab="users">👥 Users</a>
    <a data-tab="banners">🖼️ Banners</a>
    <a data-tab="centres">📍 Collection centres</a>
    <a data-tab="settings">⚙️ Settings</a>
    <div class="foot"><span id="who"></span><button id="logout">Sign out</button></div>
  </nav>
  <main>
    <header class="top">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="title">Overview</h2>
      <span class="muted" id="live">● Live</span>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="hidden"><div class="mbox"><header><h3 id="mTitle"></h3><button class="btn" id="mClose">✕</button></header><div class="mbody" id="mBody"></div></div></div>
<div id="toast" class="hidden"></div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
