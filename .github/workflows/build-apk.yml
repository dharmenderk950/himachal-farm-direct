# Builds the Himachal Farm Direct APK on GitHub's servers.
# Download it from: repository → Actions → latest "Build APK" run → Artifacts.
#
# One-time setup (repository → Settings → Secrets and variables → Actions → New repository secret):
#   GOOGLE_SERVICES_JSON  = full text of google-services.json from your Firebase project
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON secret (Settings → Secrets → Actions). See README section 7."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HimachalFarmDirect-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HimachalFarmDirect-APK
          path: HimachalFarmDirect-v1.0.0.apk
          retention-days: 30

      # Also publish on the Releases page: one tap to download the APK on a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Himachal Farm Direct (build ${{ github.run_number }})
          body: Tap HimachalFarmDirect-v1.0.0.apk below to download, then open it on your phone to install.
          files: HimachalFarmDirect-v1.0.0.apk
          make_latest: true
